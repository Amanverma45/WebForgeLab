<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Radial Dark Background Gradient -->
    <radialGradient id="bg-grad-src" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#14181b" />
      <stop offset="100%" stop-color="#07090a" />
    </radialGradient>
    
    <!-- Lime Glow Gradient -->
    <linearGradient id="lime-glow-src" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a3e635" />
      <stop offset="100%" stop-color="#65a30d" />
    </linearGradient>

    <!-- Ring Arc Gradient -->
    <linearGradient id="arc-grad-src" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84cc16" stop-opacity="1" />
      <stop offset="70%" stop-color="#a3e635" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4d7c0f" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Base Dark Circle -->
  <circle cx="250" cy="250" r="238" fill="url(#bg-grad-src)" stroke="#1a2024" stroke-width="4" />

  <!-- Outer Swirling Accent Rings -->
  <circle cx="250" cy="250" r="222" fill="none" stroke="url(#arc-grad-src)" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="1200" stroke-dashoffset="80" />
  <path d="M 65,250 A 185,185 0 1,1 435,250" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.8" stroke-linecap="round"/>

  <!-- Monogram Logo Graphics (W and F) - Perfectly Centered & Padded -->
  <g transform="translate(0, -10)">
    <!-- W (Bold White) -->
    <path d="M 118 150 L 165 285 L 198 185 L 232 285 L 278 150 L 242 150 L 218 240 L 198 185 L 178 240 L 152 150 Z" fill="#FFFFFF" />

    <!-- F (Dynamic Lime Green Chevron) -->
    <path d="M 288 150 L 382 150 L 364 195 L 314 195 L 305 218 L 350 218 L 332 258 L 292 258 L 278 285 L 250 285 Z" fill="url(#lime-glow-src)" />

    <!-- Code Symbol </> -->
    <g transform="translate(325, 238) scale(0.85)">
      <path d="M 12 18 L 2 28 L 12 38" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <line x1="24" y1="12" x2="16" y2="44" stroke="url(#lime-glow-src)" stroke-width="4.5" stroke-linecap="round" />
      <path d="M 28 18 L 38 28 L 28 38" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>
  </g>

  <!-- WEBFORGE Text -->
  <text x="250" y="345" font-family="'Plus Jakarta Sans', 'Outfit', 'Inter', sans-serif" font-weight="900" font-size="34" letter-spacing="9" text-anchor="middle">
    <tspan fill="#FFFFFF">WEB</tspan><tspan fill="#84cc16">FORGE</tspan>
  </text>

  <!-- LAB & Lines -->
  <g transform="translate(0, 375)">
    <line x1="105" y1="-6" x2="190" y2="-6" stroke="#84cc16" stroke-width="1.5" stroke-opacity="0.8" />
    <text x="250" y="0" font-family="'Plus Jakarta Sans', 'Outfit', sans-serif" font-weight="700" font-size="20" fill="#FFFFFF" letter-spacing="12" text-anchor="middle">LAB</text>
    <line x1="310" y1="-6" x2="395" y2="-6" stroke="#84cc16" stroke-width="1.5" stroke-opacity="0.8" />
  </g>

  <!-- Tagline: BUILD • DESIGN • DEPLOY -->
  <text x="250" y="408" font-family="'Plus Jakarta Sans', 'Outfit', sans-serif" font-weight="600" font-size="13" fill="#cbd5e1" letter-spacing="5" text-anchor="middle">
    BUILD <tspan fill="#84cc16">•</tspan> DESIGN <tspan fill="#84cc16">•</tspan> DEPLOY
  </text>
</svg>
